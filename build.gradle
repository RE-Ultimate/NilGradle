plugins {
	id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

sourceCompatibility = 8
targetCompatibility = 8

group = 'com.unascribed.nilgradle'
version = '1.2.1'

repositories {
	mavenCentral()
	maven {
		url 'https://maven.fabricmc.net/'
	}
	maven {
		url 'https://oss.sonatype.org/content/repositories/snapshots/'
	}
}

configurations {
	shade
	compileOnly.extendsFrom shade
}

dependencies {
	shade 'com.grack:nanojson:1.7'
	
	shade 'org.ow2.asm:asm:9.2'
	shade 'org.ow2.asm:asm-tree:9.2'
	shade 'org.ow2.asm:asm-commons:9.2'
	
	shade 'org.cadixdev:lorenz:0.5.6'
	shade 'org.cadixdev:lorenz-asm:0.5.6'
	shade 'org.cadixdev:lorenz-io-proguard:0.5.6'
	shade 'net.fabricmc:lorenz-tiny:3.0.0'
	
	shade 'org.cadixdev:atlas:0.3.0-20210102.221027-6'
}

gradlePlugin {
	plugins {
		nilgradle {
			id = 'com.unascribed.nilgradle'
			implementationClass = 'com.unascribed.nilgradle.NilPlugin'
		}
	}
}

publishing {
	repositories {
		maven {
			url "https://repo-api.sleeping.town/"
			credentials {
				username project.hasProperty("publish-username") ? project.getProperty("publish-username") : null
				password project.hasProperty("publish-password") ? project.getProperty("publish-password") : null
			}
		}
	}
}

afterEvaluate {
	publishing {
		publications {
			nilgradlePluginMarkerMaven.artifact shadowJar
		}
	}
}

jar {
	classifier 'slim'
}

shadowJar {
	classifier ''
	configurations = [project.configurations.shade]
	
	relocate 'me.jamiemansfield', 'com.unascribed.nilgradle.repackage.me.jamiemansfield'
	relocate 'com.grack', 'com.unascribed.nilgradle.repackage.com.grack'
	relocate 'net.fabricmc', 'com.unascribed.nilgradle.repackage.net.fabricmc'
	relocate 'org.cadixdev', 'com.unascribed.nilgradle.repackage.org.cadixdev'
	relocate 'org.objectweb', 'com.unascribed.nilgradle.repackage.org.objectweb'
}

tasks.build.dependsOn tasks.shadowJar

