plugins {
	id 'com.github.ben-manes.versions' version '0.51.0'
	id 'com.gradleup.shadow' version '8.3.5'
	id 'java-gradle-plugin'
	id 'maven-publish'
}

sourceCompatibility = 8
targetCompatibility = 8

base {
	group = 'com.unascribed.nilgradle'
	version = '1.4.7'
}

repositories {
	mavenCentral()
	maven {
		url 'https://repo.sleeping.town'
	}
	maven {
		url 'https://maven.fabricmc.net/'
	}
	maven {
		url 'https://oss.sonatype.org/content/repositories/snapshots/'
	}
}

configurations {
	shade
	compileOnly.extendsFrom shade
}

dependencies {
	shade 'com.grack:nanojson:1.9'
	
	shade 'org.ow2.asm:asm:9.7.1'
	shade 'org.ow2.asm:asm-tree:9.7.1'
	shade 'org.ow2.asm:asm-commons:9.7.1'
	
	shade 'org.cadixdev:lorenz:0.5.8'
	shade 'org.cadixdev:lorenz-asm:0.5.8'
	shade 'org.cadixdev:lorenz-io-proguard:0.5.8'
	shade 'net.fabricmc:lorenz-tiny:3.0.0'
	
	shade 'org.vineflower:vineflower:1.10.1'
	
	shade 'com.unascribed:flexver-java:1.1.1'
}

gradlePlugin {
	plugins {
		nilgradle {
			id = 'com.unascribed.nilgradle'
			implementationClass = 'com.unascribed.nilgradle.NilPlugin'
		}
	}
}

publishing {
	repositories {
		maven {
			url "https://repo-api.sleeping.town/"
			credentials {
				username project.hasProperty("publish-username") ? project.getProperty("publish-username") : null
				password project.hasProperty("publish-password") ? project.getProperty("publish-password") : null
			}
		}
	}
}

afterEvaluate {
	publishing {
		publications {
			nilgradlePluginMarkerMaven.artifact shadowJar
		}
	}
}

tasks.named("dependencyUpdates").configure {
	gradleReleaseChannel = 'current'
	revision = 'release'
	rejectVersionIf {
		it.candidate.version.contains("alpha") || it.candidate.version.contains("beta")
			|| (it.candidate.group == 'net.fabricmc' && it.candidate.version.startsWith("4."))
	}
}

jar {
	archiveClassifier = 'slim'
}

shadowJar {
	archiveClassifier = ''
	configurations = [project.configurations.shade]
	
	relocate 'me.jamiemansfield', 'com.unascribed.nilgradle.repackage.me.jamiemansfield'
	relocate 'com.grack', 'com.unascribed.nilgradle.repackage.com.grack'
	relocate 'net.fabricmc', 'com.unascribed.nilgradle.repackage.net.fabricmc'
	relocate 'org.cadixdev', 'com.unascribed.nilgradle.repackage.org.cadixdev'
	relocate 'org.objectweb', 'com.unascribed.nilgradle.repackage.org.objectweb'
	relocate 'org.jetbrains', 'com.unascribed.nilgradle.repackage.org.jetbrains'
	relocate 'com.unascribed.flexver', 'com.unascribed.nilgradle.repackage.com.unascribed.flexver'
}

tasks.build.dependsOn tasks.shadowJar

